[project]
name = "agente-editais"
version = "0.1.0"
description = "Agente de coleta e preservação de editais de fomento/bolsas/incubação dos portais institucionais da Rede Federal EPCT (pesquisa acadêmica PPGCS/UFBA)"
authors = [{ name = "Jonatã França Bittencourt" }]
requires-python = "==3.14.*"
dependencies = [
    # Stack exato do spine — ver ARCHITECTURE-SPINE.md §Stack
    "playwright==1.62.0",        # engine sob demanda (gatilho CAP-2); browsers via `playwright install`
    "requests==2.34.2",
    "beautifulsoup4==4.15.0",
    "lxml>=6.1.0,<6.2",
    "pypdf==6.16.1",             # extrator único de texto (CAP-6, AD-11)
    "pydantic==2.13.4",
    "typer==0.27.1",
    "PyYAML>=6.0.2,<7",
    "pandas>=2,<3",
]

[project.scripts]
agente-editais = "agente_editais.consulta:main"

[dependency-groups]
dev = [
    "pytest==9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agente_editais"]

[tool.uv]
# O guard de engine (AD-10) exige sqlite_version_info >= (3,51,3).
# Builds gerenciados pelo uv (python-build-standalone) trazem SQLite >= 3.53;
# builds de sistema no Windows podem vir com engines velhas (ex.: 3.50.4).
python-preference = "only-managed"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
