# =============================================================================
# CODEBOOK — Catálogo Analítico L2 (CAP-7)
# =============================================================================
# Instrumento derivado do Quadro Conceitual-Analítico da tese (Bittencourt,
# 2025/2026 — "Sociologia da inovação e o contexto da Rede Federal de Ensino,
# Profissional, Técnico e Tecnológico: construindo um esquema de compreensão da
# gestão e governança das políticas de inovação"). Operacionalização das 5
# Dimensões do Quadro 1.5 em sinais textuais do Quadro 1.6 (DIRETRIZES
# ANALÍTICAS §1.3.5–1.3.6), adaptada ao gênero "edital".
#
# Os TRÊS PHASE-GATES do L2 moram neste arquivo porque o congelamento É uma
# propriedade dele (o hash SHA-256 deste arquivo registra-se em cada lote em
# `lotes_l2.codebook_sha256`; mudou o arquivo ⇒ novo instrumento ⇒ novo lote).
# O comando `analise` RECUSA rodar (exit 2) enquanto qualquer um dos blocos
# abaixo não estiver preenchido:
#   1. congelamento            — quem/when: pesquisador(a), ao congelar;
#   2. trietica_dahlin         — OQ-6: decidida com o(á) orientador(a);
#   3. acordo_humano_maquina   — OQ-5: limiar fixado A PRIORI por escrito.
# =============================================================================

schema_version: 1

# Regra de precedência intra-edital declarada (FR-17) — implementada em
# código como cronologia de captura (captura posterior prevalece na
# consolidação). Mudar para classificação por TIPO documental é decisão
# humana registrada (Ask First da story).
precedencia_intra_edital: >-
  Cronologia de captura: os textos dos documentos do edital entram em ordem
  de data_captura crescente e a captura POSTERIOR prevalece na consolidação.

# -----------------------------------------------------------------------------
# DIMENSÕES E CAMPOS — Quadro Conceitual-Analítico real (Quadros 1.5 e 1.6)
# -----------------------------------------------------------------------------
# Uma dimensão por campo ("simplificação analítica"): cada campo lê o texto
# do edital com as âncoras/sinais do Quadro 1.6 e as interfaces de leitura
# da §1.3.6. Ordinais graduam presença→mecanismo em 0–2; o nominal do
# enquadramento de impacto espelha a classificação do Eixo 3 (eixo3.yaml)
# para manter coerência L1 ↔ L2 ↔ dashboard.
dimensoes:
  - id: fundamentos_epistemologicos
    nome: "Fundamentos Epistemológicos da Política de Inovação"
    definicao_operacional: >-
      Quais formas de conhecimento são reconhecidas, valorizadas e
      priorizadas no desenho e implementação da política; a política
      desafia ou reforça vieses europeus/tecnocêntricos (Quadro 1.5,
      Dimensão 1).
    campos:
      - id: hierarquia_saberes
        nome: "Hierarquia de saberes e reconhecimento epistêmico"
        escala: ordinal
        valores: [0, 1, 2]
        permite_na: true
        definicao_operacional: >-
          Grau em que o edital reconhece e integra epistemologias para além
          da científico-tecnológica (conhecimento tradicional, indígena,
          comunitário, popular) ou reproduz a hegemonia tecnocêntrica, lido
          pelos sinais do Quadro 1.6 (Dimensão 1).
        regra_decisao: >-
          0 = a dimensão aparece apenas com sinais tecnocientíficos
          ("patente", "transferência de tecnologia", "licenciamento",
          "prospecção tecnológica", "propriedade intelectual") e não há
          menção a saberes plurais; 1 = menção a saberes tradicionais/
          populares, conhecimento local, interculturalidade ou tecnologia
          social SEM mecanismo estruturante (ex.: termo isolado nas
          considerandas); 2 = integração estruturante — mecanismos concretos
          em que saberes plurais participam (extensão tecnológica em diálogo
          com saberes locais, reserva/prioridade para tecnologia social,
          critério de justiça epistêmica). N/A apenas se o edital não tratar
          da dimensão em absoluto (ex.: edital estritamente administrativo).
          Em dúvida, escolha o menor grau.
        ancoras_positivas:
          - "integração de saberes tradicionais, indígenas e populares ao lado do conhecimento científico"
          - "tecnologia social e extensão tecnológica em diálogo com o conhecimento local"
          - "interculturalidade como princípio de seleção ou avaliação dos projetos"
        ancoras_negativas:
          - "predomínio exclusivo de 'patente', 'transferência de tecnologia', 'licenciamento' e 'prospecção tecnológica'"
          - "definições copiadas da legislação federal (Marco de CT&I) citadas isoladamente, sem formulação própria do edital"
        regra_boilerplate: >-
          Definições legais copiadas da Lei de Inovação/Marco de CT&I não
          decidem sozinhas o grau; exige-se formulação própria do edital.
          Cláusulas padrão replicadas entre editais (disposições finais,
          modelos de anexo) não contam como evidência se citadas sozinhas.

  - id: atores_redes_poder
    nome: "Atores, Redes e Relações de Poder"
    definicao_operacional: >-
      Quem são os principais atores envolvidos na formulação e
      implementação da política; o edital atua como Ponto de Passagem
      Obrigatório que centraliza o poder ou distribui agência; como grupos
      sociais são incluídos ou excluídos das redes de tradução (Quadro 1.5,
      Dimensão 2).
    campos:
      - id: amplitude_redes
        nome: "Amplitude das redes de colaboração e distribuição de agência"
        escala: ordinal
        valores: [0, 1, 2]
        permite_na: true
        definicao_operacional: >-
          Quem o edital nomeia como participantes e se a rede de
          colaboração vai além dos laços internos academia-industria para
          incluir sociedade civil, movimentos sociais e comunidades locais
          (Quadro 1.6, Dimensão 2).
        regra_decisao: >-
          0 = rede restrita a atores internos (docentes, técnicos,
          estudantes do próprio campus); o edital centraliza a decisão no
          formulador (ponto de passagem obrigatório); 1 = incorpora atores
          externos tradicionais (empresas, setor produtivo, ICT parceiras)
          sem distribuir agência decisória (critérios e comissões seguem
          internos); 2 = rede ampliada com mecanismos de participação —
          sociedade civil, comunidades locais, movimentos sociais, arranjos
          produtivos locais ou economia solidária nomeados como
          destinatários ou membros de comissões/comitês. N/A apenas se a
          dimensão não se aplicar. Em dúvida, escolha o menor grau.
        ancoras_positivas:
          - "atores nomeados: sociedade civil, comunidade, movimentos sociais, arranjo produtivo local, economia solidária"
          - "comissões/comitês de avaliação com representação externa ao campus"
        ancoras_negativas:
          - "público restrito a servidores e estudantes do próprio IF"
          - "comitê exclusivamente interno, sem mecanismo de participação externa"
        regra_boilerplate: >-
          Menção genérica a "parceria" ou "empresa" em cláusula padrão não
          decide; exige-se destinatário nomeado ou mecanismo concreto de
          colaboração no corpo do edital.

  - id: relevancia_impacto_social
    nome: "Relevância e Impacto Social"
    definicao_operacional: >-
      Como a política aborda as necessidades e desafios sociais prementes do
      território; prioriza a inovação social e soluções para problemas
      locais em detrimento de ganhos puramente econômicos; há mecanismos
      para garantir resultados sociais e ambientais (Quadro 1.5, Dimensão 3).
    campos:
      - id: enquadramento_impacto
        nome: "Enquadramento da relevância e impacto social"
        escala: nominal
        opcoes:
          - instrumental
          - substantivo
          - silenciamento
        permite_na: true
        definicao_operacional: >-
          Como o edital enquadra o impacto do que financia: métricas
          exclusivamente de mercado/viabilidade financeira (razão
          instrumental), mecanismos concretos de impacto social e equidade
          (razão substantiva), ou silêncio sobre impacto social. Espelha a
          classificação do Eixo 3 (eixo3.yaml) para coerência analítica.
        regra_decisao: >-
          instrumental = critérios de avaliação/exigências pontuam
          EXCLUSIVAMENTE potencial de mercado e viabilidade financeira, sem
          sinais sociais estruturantes; substantivo = há mecanismo concreto
          de impacto social — reserva de cota, pontuação adicional,
          prioridade/desempate ou bolsa específica para tecnologias sociais,
          comunidades vulneráveis, economia solidária, ou resposta a demanda
          social/desenvolvimento regional; silenciamento = nenhum dos
          padrões anteriores é identificável. A leitura é contextual (não
          apenas presença lexical isolada). N/A apenas se a dimensão não se
          aplicar.
        ancoras_positivas:
          - "EXCLUSIVAMENTE 'potencial de mercado' e 'viabilidade financeira' como critérios de avaliação (instrumental)"
          - "cota/reserva/pontuação adicional para tecnologias sociais, comunidades vulneráveis ou economia solidária (substantivo)"
        ancoras_negativas:
          - "menção solta a 'impacto social' ou 'desenvolvimento regional' sem mecanismo — sustenta silenciamento, não substantivo"
        regra_boilerplate: >-
          Referências retóricas normativas (preâmbulos padrão sobre
          sustentabilidade ou marco legal) não decidem; exige-se critério ou
          ação no corpo do edital.

  - id: desenho_institucional_governanca
    nome: "Desenho Institucional e Governança"
    definicao_operacional: >-
      Como as políticas são governadas: as diretrizes operam como códigos
      técnicos rígidos (Feenberg) ou os mecanismos abrem margem de manobra
      para a racionalização subversiva nos campi; a tomada de decisão é
      transparente e participativa (Quadro 1.5, Dimensão 4).
    campos:
      - id: margem_manobra_governanca
        nome: "Governança: margem de manobra e participação"
        escala: ordinal
        valores: [0, 1, 2]
        permite_na: true
        definicao_operacional: >-
          Como o edital é governado e decidido: código técnico rígido versus
          racionalização subversiva; transparência, autonomia dos campi e
          participação nos processos decisórios (Quadro 1.6, Dimensão 4).
        regra_decisao: >-
          0 = código técnico rígido: normas e critérios fechados, decisões
          exclusivas do colegiado interno, sem transparência ou participação
          descrita; 1 = flexibilidade parcial: comissões/colegiados existem,
          mas de composição interna e/ou sem mecanismos de participação
          externa; 2 = governança participativa com margem de manobra:
          comitês com representação externa, transparência procedimental,
          autonomia dos campi na execução, mecanismos de participação
          descritos. N/A apenas se a dimensão não se aplicar. Em dúvida,
          escolha o menor grau.
        ancoras_positivas:
          - "conselho/comitê com representação da comunidade ou de atores externos"
          - "transparência e publicidade do processo de seleção; autonomia do campus na execução"
        ancoras_negativas:
          - "as decisões cabem exclusivamente ao colegiado interno"
          - "critérios fixados unilateralmente pela reitoria, sem participação descrita"
        regra_boilerplate: >-
          "Comissão de avaliação" genérica (obrigatória por legislação) não
          decide sozinha; exige-se composição ou mecanismo descrito no
          edital.

  - id: contextualizacao_desenvolvimento_regional
    nome: "Contextualização e Desenvolvimento Regional"
    definicao_operacional: >-
      Quão bem a política responde ao contexto socioeconômico, cultural e
      histórico específico da região; aproveita as forças regionais e aborda
      as vulnerabilidades locais; promove desenvolvimento endógeno e reduz
      dependências históricas (Quadro 1.5, Dimensão 5).
    campos:
      - id: sensibilidade_regional
        nome: "Contextualização territorial e desenvolvimento endógeno"
        escala: ordinal
        valores: [0, 1, 2]
        permite_na: true
        definicao_operacional: >-
          Sensibilidade do edital ao território: vocação regional, arranjos
          locais, vulnerabilidade, inserção regional, desenvolvimento
          endógeno, conhecimento local (Quadro 1.6, Dimensão 5).
        regra_decisao: >-
          0 = ausência de contextualização: nenhum sinal regional
          identificável no edital; 1 = menção genérica a desenvolvimento
          regional/território sem mecanismo; 2 = contextualização
          estruturante: mecanismos que aproveitam vocações regionais,
          endereçam vulnerabilidades locais ou promovem desenvolvimento
          endógeno (prioridade territorial, critérios de recorte regional,
          parcerias com arranjos locais). N/A apenas se a dimensão não se
          aplicar. Em dúvida, escolha o menor grau.
        ancoras_positivas:
          - "vocações regionais e arranjos produtivos/ecossistemas locais como eixo do edital"
          - "recorte territorial que atende vulnerabilidades ou promove desenvolvimento endógeno"
        ancoras_negativas:
          - "edital genérico, sem qualquer referência territorial"
          - "dependência de metas nacionais sem mediação pelo contexto local"
        regra_boilerplate: >-
          Menção a "desenvolvimento regional" em preâmbulo padrão não
          decide; exige-se formulação própria do edital vinculada à região.

# =============================================================================
# PHASE-GATE 1 — CONGELAMENTO (PREENCHER AO CONGELAR)
# Quem: o(a) pesquisador(a) responsável. Quando: após finalizar o conteúdo
# científico acima e ANTES do primeiro lote L2. Congelado = este arquivo não
# muda mais sem novo commit e nova assinatura de lote.
# =============================================================================
congelamento:
  congelado_em: "2026-09-09T21:04:19-03:00"
  congelado_por: "Jonatã França Bittencourt"

# =============================================================================
# PHASE-GATE 2 — TRÍADE DE DAHLIN (OQ-6)
# Decidir com o(à) orientador(a): a Tríade entra no codebook ou sua exclusão
# é justificada na tese? Registre true SOMENTE após decisão por escrito.
# Regras do carregador: resolvida=true EXIGE decisao ∈ {incorporada,
# excluida_justificada}; exclusão exige justificativa não vazia; enquanto
# resolvida=false, a justificativa deve registrar onde/por que a decisão
# segue pendente.
# =============================================================================
trietica_dahlin:
  resolvida: true
  decisao: excluida_justificada
  justificativa: >-
    A Tríade de Dahlin (Organizacional, Ambiental, Relativa) classifica as
    dimensões do processo de INOVAÇÃO NO NÍVEL DO INOVADOR INDIVIDUAL/DA
    EQUIPE (recursos organizacionais, ambiente e relações do invento). A
    unidade de análise desta tese é o DISCURSO INSTITUCIONAL normativo
    (editais, políticas, chamadas) da Rede Federal EPCT — nível
    meso/institucional, não o inovador individual. As preocupações da tríade
    já são cobertas, em outra escala, pelas 5 dimensões do Quadro 1.5 a este
    nível: o aspecto organizacional pela Dimensão 4 (Desenho Institucional e
    Governança), o ambiental pela Dimensão 5 (Contextualização e
    Desenvolvimento Regional) e o relacional pela Dimensão 2 (Atores, Redes
    e Relações de Poder). Portanto a tríade NÃO entra como dimensão própria
    do codebook: sua exclusão é justificada na tese (OQ-6), evitando
    ecologia falsa entre níveis de análise distintos.

# =============================================================================
# PHASE-GATE 3 — ACORDO HUMANO-MÁQUINA (OQ-5)
# Limiar de concordância fixado A PRIORI, POR ESCRITO, com o(à) orientador(a).
# Assumido no projeto: κ ≥ 0,75 (SPEC §Assumptions). Valor com 0 < κ ≤ 1.
# =============================================================================
acordo_humano_maquina:
  limiar_kappa: 0.75
  nota: >-
    Limiar fixado a priori por escrito (OQ-5): κ ≥ 0,75 sobre a subamostra
    virgem, conforme suposição registrada no SPEC (Assumptions) e no PRD
    (§12). Ratificado em 2026-09-09 com o(a) orientador(a) para o
    congelamento do instrumento.