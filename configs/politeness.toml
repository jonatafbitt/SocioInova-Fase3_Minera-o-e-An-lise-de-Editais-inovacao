# Polidez do fetcher — ÚNICO módulo com I/O de rede (AD-5).
# Versionado em git (AD-9); cada lote registra o hash das configs usadas.
#
# NOTA: o UA declara a intenção de respeitar robots.txt; a LEITURA e aplicação
# de robots.txt por host entrou na Story 2 (fetcher.robots_para_host, §9.1) —
# violar robots é bug crítico e não tem knob: é sempre honrado.

delay_minimo_s = 2.0
off_peak = "22:00-06:00" # janela interpretada no fuso do HOST

user_agent = "agente-editais/0.1 (pesquisa academica PPGCS/UFBA; coleta responsavel de editais publicos da Rede Federal EPCT para preservacao e analise; robots.txt respeitado no crawling)"

[crawl]
# A partir da Story 2 o crawling OBRIGA a janela off-peak (fuso do HOST);
# fora dela o comando 'descobrir' recusa rodar (exit 1). O probe do pré-voo
# continua checagem leve e não é afetado por esta chave.
respeitar_janela_off_peak = true
# Teto de páginas baixadas POR PORTAL numa execução de 'descobrir' — o BFS
# para e registra evento quando atinge. Crawl-delay declarado pelo host é
# honrado além do delay_minimo_s.
max_paginas_por_portal = 200
# Cap de tamanho POR DOCUMENTO (MB) na coleta (Story 3, CAP-4): resposta que
# passa do teto aborta a leitura ANTES de gravar e vira evento
# tamanho_excedido — o lote segue sem o documento. Valores inf/nan são
# recusados na carga.
max_mb_documento = 50
# Prazo TOTAL de cada download (s): um trickle que estourar vira falha do
# candidato — nunca um PDF pendurado segura o lote.
download_prazo_s = 300
# Timeout só da LEITURA do corpo do download (s), separado do timeout do
# probe ([probe] timeout_s).
download_timeout_s = 60
# HTTP 403 CONSECUTIVOS que caracterizam bloqueio persistente e suspendem o
# host pelo restante da execução (restante DO HOST é pulado; outros hosts
# seguem; a suspensão é compartilhada entre portais numa execução --todos).
max_403_consecutivos = 3

[probe]
timeout_s = 10
# O probe do pré-voo é checagem leve de alcançabilidade (FR-2), não crawl:
# a janela obrigatória do crawling vive na seção [crawl] acima.
respeitar_janela_off_peak = false

[texto]
# CAP-6 (Story 4): limiar de PDF escaneado — um Documento recebe
# flag_escaneado=true quando os caracteres extraíveis ficam ABAIXO de
# (limiar × nº de páginas). O OCR é decisão futura sob demanda: aqui só a
# flag. Consumido pelo extrator único (texto.py, AD-11).
limiar_chars_por_pagina = 100
# Fase 3.1 (resgate por OCR): knobs do estágio opcional 'ocrescer'.
# confiança_minima: página só entra no texto óptico se a confiança MÉDIA das
# palavras ficar >= valor (0..100) — abaixo disso a página é descartada e,
# se nenhuma página passar, o documento permanece escaneado.
ocr_confianca_minima = 60
# Idioma do tesseract (pack de idioma instalado no sistema, ex.: 'por').
ocr_lang = "por"
